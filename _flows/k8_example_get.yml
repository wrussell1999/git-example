id: k8_example_get
namespace: example

inputs:
  - id: resources
    type: MULTISELECT
    allowCustomValue: true
    values:
      - my-pod
      - my-pod-2

tasks:
  - id: delete
    type: io.kestra.plugin.kubernetes.kubectl.Delete
    namespace: default
    resourceType: pods
    resourcesNames: "{{ inputs.resources }}"

pluginDefaults:
  - forced: true
    type: io.kestra.plugin.kubernetes
    values:
      connection:
        masterUrl: "host.docker.internal:60480"
        oauthToken: "{{ secret('K8_TOKEN') }}"
        trustCerts: true