id: for_each_parallel
namespace: example

tasks:
  - id: parallel_standard
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: log_1_standard
        type: io.kestra.core.tasks.log.Log
        message: "1"
      - id: log_2_standard
        type: io.kestra.core.tasks.log.Log
        message: "2"
      - id: log_3_standard
        type: io.kestra.core.tasks.log.Log
        message: "3"

  - id: foreach
    type: io.kestra.plugin.core.flow.ForEach
    values: [1,2,3,4,5,6]
    tasks:
      - id: parallel
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: log_1
            type: io.kestra.core.tasks.log.Log
            message: "1: {{ parent.taskrun.value }}"
          - id: log_2
            type: io.kestra.core.tasks.log.Log
            message: "2: {{ parent.taskrun.value }}"