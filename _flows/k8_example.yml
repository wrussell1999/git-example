id: k8_example
namespace: example

tasks:
  - id: create
    type: io.kestra.plugin.kubernetes.core.PodCreate
    namespace: monitoring
    delete: false
    metadata:
      labels:
        my-label: my-value
    spec:
      containers:
      - name: unittest
        image: debian:stable-slim
        command:
          - 'bash'
          - '-c'
          - 'for i in {1..10}; do echo $i; sleep 0.1; done'
      restartPolicy: Never

  - id: get
    type: io.kestra.plugin.kubernetes.kubectl.Get
    namespace: monitoring
    resourceType: pods
    fetchType: FETCH

  - id: log
    type: io.kestra.plugin.core.log.Log
    message: "{{ outputs.get.statusItems }}"

  - id: delete
    type: io.kestra.plugin.kubernetes.kubectl.Delete
    namespace: monitoring
    resourceType: pods
    resourcesNames:
      - "{{ outputs.create.metadata.name }}"

pluginDefaults:
  - forced: true
    type: io.kestra.plugin.kubernetes
    values:
      connection:
        masterUrl: "host.docker.internal:60480"
        oauthToken: "{{ secret('K8_TOKEN') }}"
        trustCerts: true