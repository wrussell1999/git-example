id: lobster_656157
namespace: example

tasks:
  - id: list
    type: io.kestra.plugin.aws.s3.List
    
  - id: download
    type: io.kestra.plugin.aws.s3.Download
    key: "myfile.pdf"

pluginDefaults:
  - forced: false
    type: io.kestra.plugin.aws
    values:
      accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      secretKeyId: "{{ secret('AWS_SECRET_KEY_ID') }}"
      bucket: "will-example"
      region: "eu-west-2"