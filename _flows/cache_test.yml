id: cache_test
namespace: example

inputs:
  - id: data
    type: ARRAY
    itemType: INT
    defaults: [0,1,2]

tasks:
  - id: foreach
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.data }}"
    tasks:
      - id: parallel
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: output
            type: io.kestra.plugin.core.output.OutputValues
            values:
              number_value: "{{ parent.taskrun.value }}"
          - id: log
            type: io.kestra.plugin.core.log.Log
            message: "Hello: {{ parent.taskrun.value }}"

outputs:
  - id: test
    type: STRING
    value: "hello"